<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cas RC Trainingsweek</title>
  <meta name="description" content="Weekschema krachttraining Castricumse Rugby Club">
  <meta name="theme-color" content="#0d0d0b">
  <meta name="color-scheme" content="dark">

  <!-- Beginscherm / app-modus -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cas RC">

  <!-- Lettertypes (met fallbacks: de app werkt ook zonder) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hoops" aria-hidden="true"></div>

  <header class="wrap top">
    <div class="club">Castricumse Rugby Club · Wouterland</div>
    <h1>Trainings&shy;week</h1>
    <div class="viewtabs" role="tablist" aria-label="Weergave">
      <button type="button" role="tab" id="tab-schema" data-view="schema" aria-selected="true">Schema</button>
      <button type="button" role="tab" id="tab-stats" data-view="stats" aria-selected="false">Stats</button>
    </div>
  </header>

  <nav class="days" id="daysNav" aria-label="Dagen van de week">
    <div class="wrap days-grid" id="days" role="tablist"></div>
  </nav>

  <main class="wrap" id="main"></main>
  <main class="wrap" id="stats" hidden></main>

  <p class="toast" id="toast" role="status" hidden></p>

  <div class="timer" id="timer">
    <div class="wrap timer-row">
      <div class="clock-box">
        <span class="tlabel">Rust</span>
        <span class="clock" id="clock">0:00</span>
      </div>
      <div class="tbtns">
        <button type="button" data-s="60">60s</button>
        <button type="button" data-s="90">90s</button>
        <button type="button" data-s="120">2m</button>
        <button type="button" class="stop" id="stop">Stop</button>
      </div>
    </div>
  </div>

  <noscript><p class="wrap">Zet JavaScript aan om het schema te zien.</p></noscript>

  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
